name: Release

# Push a tag like v0.1.0 (it must match "version" in manifest.json) to publish a release.
# HACS installs the attached virtual_device.zip (see hacs.json).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/ci.yaml

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Tag must match the manifest version
        run: |
          version=$(python3 -c "import json; print(json.load(open('custom_components/virtual_device/manifest.json'))['version'])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest version $version" >&2
            exit 1
          fi
      - name: Build the ZIP for HACS
        run: cd custom_components/virtual_device && zip -r ../../virtual_device.zip . -x "__pycache__/*"
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" virtual_device.zip --generate-notes
