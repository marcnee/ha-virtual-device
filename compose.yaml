# What both Home Assistant dev services share.
x-dev-instance: &dev-instance
  profiles: ["dev"]
  volumes:
    - ./dev/config:/config
    - ./custom_components/virtual_device:/config/custom_components/virtual_device
    - ./dev-config/configuration.yaml:/config/configuration.yaml:ro
  restart: unless-stopped

services:
  # docker compose run --rm test [pytest options]
  test:
    build:
      context: .
      dockerfile: Dockerfile.test
    volumes:
      - .:/app

  # Tests that wait for the VS Code debugger ("Attach: tests in Docker", port 5678):
  # docker compose run --rm --service-ports test-debug [pytest options]
  test-debug:
    build:
      context: .
      dockerfile: Dockerfile.test
    entrypoint: ["python", "-m", "debugpy", "--listen", "0.0.0.0:5678", "--wait-for-client", "-m", "pytest"]
    ports:
      - "5678:5678"
    volumes:
      - .:/app

  # Same tests against the NEWEST Home Assistant release / beta (see Dockerfile.compat).
  # docker compose build --no-cache test-latest && docker compose run --rm test-latest
  test-latest:
    build:
      context: .
      dockerfile: Dockerfile.compat
    volumes:
      - .:/app

  test-beta:
    build:
      context: .
      dockerfile: Dockerfile.compat
      args:
        PRE: "--pre"
    volumes:
      - .:/app

  # Home Assistant's own checks of manifest.json and translations, the same image the GitHub
  # action hassfest runs: docker compose run --rm hassfest
  hassfest:
    image: ghcr.io/home-assistant/hassfest
    # The image only exists for amd64; on ARM machines (Apple Silicon) Docker emulates it.
    platform: linux/amd64
    volumes:
      - .:/github/workspace

  # docker compose run --rm lint
  lint:
    build:
      context: .
      dockerfile: Dockerfile.test
    entrypoint: ["sh", "-c", "ruff check . && ruff format --check ."]
    volumes:
      - .:/app

  # docker compose --profile dev up homeassistant   ->  http://localhost:8123
  homeassistant:
    <<: *dev-instance
    image: ghcr.io/home-assistant/home-assistant:2026.10.4
    ports:
      - "8123:8123"

  # The same with a debugger for VS Code ("Attach: Home Assistant in Docker", port 5679):
  # docker compose --profile dev up homeassistant-debug
  homeassistant-debug:
    <<: *dev-instance
    build:
      context: .
      dockerfile: Dockerfile.dev
    entrypoint:
      ["python3", "-m", "debugpy", "--listen", "0.0.0.0:5679", "-m", "homeassistant", "--config", "/config"]
    ports:
      - "8123:8123"
      - "5679:5679"
